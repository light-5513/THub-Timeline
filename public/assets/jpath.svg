<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 44" fill="none">
  <defs>
    <linearGradient id="jpathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="jPathArrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e9d5ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7c3aed" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Modern Icon Monogram Badge -->
  <g filter="url(#shadow)">
    <rect x="2" y="4" width="36" height="36" rx="10" fill="url(#jpathGrad)" />
    <!-- Stylized J with upward pathway notch -->
    <path d="M 23 12 L 23 25 C 23 28.5 20.5 31 17 31 C 13.8 31 11.5 28.8 11.5 26" stroke="url(#jPathArrow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Dynamic Career Trajectory Arrow Dot -->
    <circle cx="23" cy="12" r="2.2" fill="#ffffff" />
    <path d="M 20.5 17 L 25.5 17" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- J-path Wordmark -->
  <text x="46" y="29" font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" letter-spacing="-0.03em">
    <tspan fill="#6d28d9">J</tspan>
    <tspan fill="#8b5cf6" font-weight="700">-</tspan>
    <tspan fill="#7c3aed" font-weight="800">path</tspan>
  </text>
  
  <!-- Sleek Accent Dot -->
  <circle cx="146" cy="24" r="3" fill="#a855f7" />
</svg>
