<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" fill="none">
  <defs>
    <!-- Background Gradient for Icon Capsule -->
    <linearGradient id="podGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Glowing Accent -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="podGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#059669" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left: AI Pod Symbol -->
  <g transform="translate(6, 6)" filter="url(#podGlow)">
    <!-- Pod Capsule Body -->
    <rect x="0" y="2" width="48" height="48" rx="14" fill="url(#podGrad)" />
    
    <!-- Outer Audio / AI Neural Wave Rings -->
    <circle cx="24" cy="26" r="16" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.45" />

    <!-- Center AI Interview Voice Wave & Camera Pod -->
    <path d="M14 26 C14 22, 18 20, 24 20 C30 20, 34 22, 34 26 C34 30, 30 32, 24 32 C18 32, 14 30, 14 26 Z" fill="#ffffff" opacity="0.25" />
    
    <!-- Sound Waves / Audio Analyzer Bars -->
    <rect x="17" y="23" width="2.5" height="6" rx="1.25" fill="#ffffff" />
    <rect x="21" y="19" width="2.5" height="14" rx="1.25" fill="#ffffff" />
    <rect x="25" y="17" width="2.5" height="18" rx="1.25" fill="#ffffff" />
    <rect x="29" y="21" width="2.5" height="10" rx="1.25" fill="#ffffff" />

    <!-- AI Spark Dot -->
    <circle cx="36" cy="12" r="3.5" fill="#34d399" />
    <circle cx="36" cy="12" r="1.5" fill="#ffffff" />
  </g>

  <!-- Right: Wordmark -->
  <!-- "m" in vibrant gradient lowercase -->
  <text x="64" y="38" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" fill="url(#mGrad)" letter-spacing="-0.04em">m</text>

  <!-- "POD" in bold high-tech uppercase -->
  <text x="96" y="38" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" fill="#0f172a" letter-spacing="-0.03em">POD</text>

  <!-- Tag Pill: "AI INTERVIEWS" -->
  <rect x="65" y="44" width="98" height="14" rx="4" fill="rgba(5, 150, 105, 0.12)" />
  <text x="70" y="54.5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="7.5" fill="#047857" letter-spacing="0.1em">AI INTERVIEW POD</text>
</svg>
