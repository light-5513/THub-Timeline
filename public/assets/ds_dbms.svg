<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  
  <!-- Left: Database Cylinder Stack (DBMS) -->
  <g transform="translate(25, 20)">
    <!-- Cylinder 3 (Bottom) -->
    <path d="M 10 75 C 10 65 70 65 70 75 L 70 100 C 70 110 10 110 10 100 Z" fill="url(#dbGrad)" opacity="0.85"/>
    <ellipse cx="40" cy="75" rx="30" ry="10" fill="#38bdf8" opacity="0.9"/>
    
    <!-- Cylinder 2 (Middle) -->
    <path d="M 10 45 C 10 35 70 35 70 45 L 70 70 C 70 80 10 80 10 70 Z" fill="url(#dbGrad)" opacity="0.9"/>
    <ellipse cx="40" cy="45" rx="30" ry="10" fill="#38bdf8" opacity="0.95"/>
    
    <!-- Cylinder 1 (Top) -->
    <path d="M 10 15 C 10 5 70 5 70 15 L 70 40 C 70 50 10 50 10 40 Z" fill="url(#dbGrad)"/>
    <ellipse cx="40" cy="15" rx="30" ry="10" fill="#7dd3fc"/>
  </g>

  <!-- Right: Data Structure Tree Nodes (DS) -->
  <g transform="translate(130, 20)">
    <!-- Connector Branches -->
    <line x1="45" y1="20" x2="20" y2="60" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="20" x2="70" y2="60" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="60" x2="10" y2="100" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="60" x2="35" y2="100" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    <line x1="70" y1="60" x2="80" y2="100" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>

    <!-- Nodes -->
    <circle cx="45" cy="20" r="12" fill="url(#dbGrad)"/>
    <circle cx="20" cy="60" r="10" fill="url(#nodeGrad)"/>
    <circle cx="70" cy="60" r="10" fill="url(#nodeGrad)"/>
    <circle cx="10" cy="100" r="8" fill="#38bdf8"/>
    <circle cx="35" cy="100" r="8" fill="#38bdf8"/>
    <circle cx="80" cy="100" r="8" fill="#38bdf8"/>
  </g>

  <!-- Text Label -->
  <text x="120" y="158" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#0369a1" letter-spacing="1.5">
    DS &amp; DBMS
  </text>
</svg>
